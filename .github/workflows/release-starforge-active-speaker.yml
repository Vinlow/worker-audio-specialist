name: Release | Build and publish Starforge active-speaker image

on:
  push:
    tags:
      - starforge-active-speaker-release-*
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit on holy-grale to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: starforge-active-speaker-image-release
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Lock the release commit and builder fuse
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha || github.sha }}
          BUILDER_READY: ${{ vars.AUDIO_WORKER_BUILDER_READY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/holy-grale:refs/remotes/origin/holy-grale
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/holy-grale
          if [[ "$BUILDER_READY" != "true" ]]; then
            echo "AUDIO_WORKER_BUILDER_READY is not true." >&2
            exit 1
          fi
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.10"
      - name: Compile the exact vendored closure
        run: python -m compileall -q starforge_active_speaker

  image-release:
    needs: preflight
    runs-on: [self-hosted, linux, x64, audio-worker-builder]
    environment: Production
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG: ghcr.io/vinlow/worker-audio-specialist:starforge-active-speaker-${{ inputs.commit_sha || github.sha }}
      RELEASE_SHA: ${{ inputs.commit_sha || github.sha }}
      TEST_TAG: starforge-active-speaker:test-${{ inputs.commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - name: Require the exact builder contract
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          docker info >/dev/null
          docker buildx version
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          free_kib="$(df -Pk "$docker_root" | awk 'NR==2 {print $4}')"
          required_kib=$((100 * 1024 * 1024))
          if (( free_kib < required_kib )); then
            echo "Builder needs at least 100 GiB free under $docker_root." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: audio-worker-buildkit
          driver: docker-container
          driver-opts: |
            memory=64g
            memory-swap=72g
            cpuset-cpus=0-15
          keep-state: true
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and execute the image-resident test target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./starforge_active_speaker
          file: ./starforge_active_speaker/Dockerfile.runpod
          target: test
          load: true
          push: false
          tags: ${{ env.TEST_TAG }}
          build-args: |
            AUDIO_WORKER_RELEASE_SHA=${{ inputs.commit_sha || github.sha }}
      - name: Build the exact deployable runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./starforge_active_speaker
          file: ./starforge_active_speaker/Dockerfile.runpod
          target: runtime
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            AUDIO_WORKER_RELEASE_SHA=${{ inputs.commit_sha || github.sha }}
      - name: Authenticate the runtime image contract
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_SHA"
          docker run --rm --network none --entrypoint python "$IMAGE_TAG" -c \
            'import active_speaker_runpod_handler as h; assert h.EXPECTED_RUNTIME_IDENTITY == "sha256:24e157e4139dccc1db2c10f0185fa59aa4f361f830c0fa62ed3cd65c47c1b801"'
      - name: Publish only after every image gate passes
        id: publish
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          image_digest="$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_image="ghcr.io/vinlow/worker-audio-specialist@$image_digest"
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          receipt_tag="starforge-active-speaker-image-${image_digest#sha256:}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$receipt_tag" "$RELEASE_SHA" -m "$immutable_image"
          git push origin "refs/tags/$receipt_tag"
          RELEASE_IMAGE="$immutable_image" python -c 'import json, os; print(json.dumps({"kind":"w2l-starforge-active-speaker-image-release-v1","workerCommitSha":os.environ["RELEASE_SHA"],"starforgeSourceSha":"d152069a098f9539615c2b8a20421523cfb808b2","immutableImage":os.environ["RELEASE_IMAGE"]}, sort_keys=True))' > release-receipt.json
          {
            echo "## Starforge active-speaker image published"
            echo
            echo "- Worker commit: \`$RELEASE_SHA\`"
            echo "- Starforge source: \`d152069a098f9539615c2b8a20421523cfb808b2\`"
            echo "- Immutable image: \`$immutable_image\`"
            echo "- Digest receipt tag: \`$receipt_tag\`"
            echo "- Deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the immutable release receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: starforge-active-speaker-image-${{ inputs.commit_sha || github.sha }}
          path: release-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove mutable local images
        if: always()
        run: |
          docker image rm "$TEST_TAG" || true
          docker image rm "$IMAGE_TAG" || true
