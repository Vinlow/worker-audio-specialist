name: Release | Build and publish Holy Grale image

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit on holy-grale to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: audio-worker-holy-grale-image-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}
      - name: Lock the release commit and builder fuse
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
          BUILDER_READY: ${{ vars.AUDIO_WORKER_BUILDER_READY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/holy-grale:refs/remotes/origin/holy-grale
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/holy-grale
          if [[ "$BUILDER_READY" != "true" ]]; then
            echo "AUDIO_WORKER_BUILDER_READY is not true. Keep the release fuse closed until a registered Linux x64 audio-worker-builder runner passes the documented bootstrap checks." >&2
            exit 1
          fi
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.10"
      - name: Re-run hosted source and deployment gates
        run: |
          python -m compileall -q src builder scripts
          python -m unittest -v scripts.test_deploy_holy_grale_test

  image-release:
    needs: preflight
    runs-on: [self-hosted, linux, x64, audio-worker-builder]
    environment: Production
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ghcr.io/vinlow/worker-audio-specialist:${{ inputs.commit_sha }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Require the exact builder contract
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          docker info >/dev/null
          docker buildx version
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          free_kib="$(df -Pk "$docker_root" | awk 'NR==2 {print $4}')"
          required_kib=$((100 * 1024 * 1024))
          if (( free_kib < required_kib )); then
            echo "Builder needs at least 100 GiB free under $docker_root; found $((free_kib / 1024 / 1024)) GiB." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: audio-worker-buildkit
          driver: docker-container
          driver-opts: |
            memory=64g
            memory-swap=72g
            cpuset-cpus=0-15
          keep-state: true
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require gated-model build credentials
        env:
          AUDIO_WORKER_HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
        run: test -n "$AUDIO_WORKER_HF_TOKEN"
      - name: Build the exact deployable image without publishing it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            GATED_MODELS_AVAILABLE=${{ secrets.HF_TOKEN != '' || secrets.HUGGINGFACE_TOKEN != '' }}
            AUDIO_WORKER_BUILD_SHA=${{ inputs.commit_sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN }}
      - name: Run every unit and contract test inside the image
        run: >-
          docker run --rm
          --cpus 16
          --memory 64g
          --memory-swap 72g
          --entrypoint python
          "$IMAGE_TAG"
          -m unittest discover -v -s / -p 'test_*.py'
      - name: Load the baked diarizer fully offline
        run: >-
          docker run --rm --network none
          --cpus 16
          --memory 64g
          --memory-swap 72g
          -e AUDIO_WORKER_REAL_MODEL_SMOKE=1
          --entrypoint python
          "$IMAGE_TAG"
          -m unittest -v test_diarizer_real_model
      - name: Score real audio with baked CLAP fully offline
        run: >-
          docker run --rm --network none
          --cpus 16
          --memory 64g
          --memory-swap 72g
          -e AUDIO_WORKER_REAL_MODEL_SMOKE=1
          --entrypoint python
          "$IMAGE_TAG"
          -m unittest -v test_clap_real_model
      - name: Publish only after every image gate passes
        id: publish
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          image_digest="$(docker buildx imagetools inspect "$IMAGE_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_image="ghcr.io/vinlow/worker-audio-specialist@$image_digest"
          echo "immutable_image=$immutable_image" >> "$GITHUB_OUTPUT"
          RELEASE_IMAGE="$immutable_image" python -c 'import json, os; print(json.dumps({"kind":"w2l-audio-worker-image-release-v1","commitSha":os.environ["RELEASE_SHA"],"immutableImage":os.environ["RELEASE_IMAGE"]}, sort_keys=True))' > release-receipt.json
          {
            echo "## Holy Grale image published"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Immutable image: \`$immutable_image\`"
            echo "- Deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the immutable release receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: holy-grale-image-${{ inputs.commit_sha }}
          path: release-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove the mutable local release image
        if: always()
        run: docker image rm "$IMAGE_TAG" || true
