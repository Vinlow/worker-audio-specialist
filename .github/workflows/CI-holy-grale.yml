name: CI | Holy Grale source gate

on:
  push:
    branches: [holy-grale, main]
  pull_request:
    branches: [holy-grale, main]
concurrency:
  group: audio-worker-holy-grale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Compile every worker and builder module
        run: python -m compileall -q src builder scripts
      - name: Verify locked deployment tooling
        run: python -m unittest -v scripts.test_deploy_holy_grale_test

      # Image builds are deliberately NOT scheduled by a push. The image is too
      # large for GitHub's standard 14 GB runner and silently queued for 24 hours
      # when the old `DO` label had no registered runner. Use the explicit
      # `Release | Build and publish Holy Grale image` workflow instead.
